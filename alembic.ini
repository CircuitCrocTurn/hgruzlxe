# Alembic configuration for Offerday.
#
# We do NOT set ``sqlalchemy.url`` here — the URL is read from the
# environment (DATABASE_URL) inside ``alembic/env.py`` so the same
# .env that the FastAPI app uses also drives migrations.
#
# Run migrations with:
#   alembic upgrade head
# Generate a new migration after model changes:
#   alembic revision --autogenerate -m "<short description>"

[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC

# Migrations are written by the application code as ``import``-able
# Python modules.  Keep them under version control alongside the source.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
